# Альтернативний спосіб підняти базу — на випадок, якщо локальної служби
# PostgreSQL немає. Порт назовні той самий 5433, що й у локальної інсталяції,
# тож рядок підключення міняти не доведеться.
services:
  postgres:
    image: postgres:18-alpine
    container_name: autolot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autolot}
      POSTGRES_USER: ${POSTGRES_USER:-autolot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не заданий — скопіюйте .env.example у .env}
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-autolot} -d ${POSTGRES_DB:-autolot}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
